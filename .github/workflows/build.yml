name: build-unix

# Builds the Linux and macOS command line binaries with CMake.
#
# The build logic lives in build/build_unix.sh, an ordinary part of the
# repository; this file only supplies the machines and publishes the results.
# The script writes its release folder to dist/<platform>/, and every
# intermediate stays under build/out/cmake_unix/.
#
#   * Run it by hand (Actions -> build-unix -> Run workflow) to get the
#     binaries as workflow artifacts.
#   * Push a tag such as v2.1.0 and it attaches them to that GitHub release.
#
# The Windows executable is NOT built here. It needs MSVC, the Windows SDK and
# the MSIX tooling (makeappx/signtool) for the context menu package, so it is
# built with build\build_exe.bat on a Windows machine.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux_x86_64
          - os: macos-15-intel
            tag: macos_x86_64
          - os: macos-15
            tag: macos_arm64
    steps:
      - uses: actions/checkout@v4

      # MuPDF is the PDF engine. Unlike the Python build there is no wheel that
      # bundles it, so each runner installs the distribution package:
      # CMakeLists.txt finds it through the normal system paths.
      - name: Install MuPDF (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev

      - name: Install MuPDF (macOS)
        if: runner.os == 'macOS'
        run: brew install mupdf

      - name: Build with CMake
        run: bash build/build_unix.sh

      - name: Smoke test
        run: |
          folder="$(ls -d dist/*/pdf-compress_*_${{ matrix.tag }})"
          "$folder/pdf_compress" --help > /dev/null
          "$folder/pdf_compress" --version
          "$folder/pdf_compress" --help-cn | head -3
          echo "the binary starts and prints help"

      - name: List artifacts
        run: ls -lhR dist

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-compress-${{ matrix.tag }}
          path: dist/*/pdf-compress_*_${{ matrix.tag }}/
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release asset has to be a file, so the folder is packed here.
          # build_unix.sh deliberately leaves it unpacked.
          folder="$(ls -d dist/*/pdf-compress_*_${{ matrix.tag }})"
          asset="pdf-compress-${{ matrix.tag }}.tar.gz"
          tar -czf "$asset" -C "$(dirname "$folder")" "$(basename "$folder")"
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "pdf_compress ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
